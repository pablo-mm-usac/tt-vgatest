
# Tiny Tapeout project information
project:
  title:        "VGA Bounce & Clone"      # Project title
  author:       "Pedro Pablo Molina Martínez"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "VGA bouncing logos with adjustable speed and impact cloning, up to four simultaneous logos."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pablo_mm_usac_pruebavga"
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "tt_um_pablo_mm_usac_pruebavga.v"
    - "hvsync_generator.v"
    - "palette.v"
    - "bitmap_rom.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Tile mode"
  ui[1]: "Color mode"
  ui[2]: "Speed bit 0"
  ui[3]: "Speed bit 1"
  ui[4]: "Speed bit 2"
  ui[5]: "Speed bit 3"
  ui[6]: "Speed bit 4"
  ui[7]: "Clone enable"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
